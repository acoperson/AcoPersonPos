name: ACOPOS CI

on:
  push:
    branches:
      - "acopos/platform-complete"
  pull_request:
    branches:
      - main
      - "acopos/platform-complete"

permissions:
  contents: read

jobs:
  verify:
    name: Build and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check (report without blocking production build)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build production bundle
        run: npm run build
